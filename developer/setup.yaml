channels:
  - conda-forge
dependencies:
  # Go 1.26.9 is not available from Conda Forge yet. The root go.mod requires
  # 1.26.9, so Go's default toolchain auto-selection upgrades this bootstrap.
  - python=3.10.15
  - invoke=2.2.0
  # Note: needs to match the version in robot_requirements.txt
  # Also in rcc-pipeline
  - robotframework=6.1.1
  - go=1.26.5
  - golangci-lint=2.12.2
  - git=2.46.0
  # The Linux runtime-policy tests invoke prlimit for CPU and address-space limits.
  - util-linux

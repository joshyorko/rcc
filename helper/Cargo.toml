[package]
name = "rcc-rattler-helper"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"
rattler = { git = "https://github.com/conda/rattler", rev = "fa471774d9975a65febae10d8405637f89d2ba85", default-features = false, features = ["rustls"] }
rattler_cache = { git = "https://github.com/conda/rattler", rev = "fa471774d9975a65febae10d8405637f89d2ba85", default-features = false }
rattler_conda_types = { git = "https://github.com/conda/rattler", rev = "fa471774d9975a65febae10d8405637f89d2ba85", default-features = false }
rattler_solve = { git = "https://github.com/conda/rattler", rev = "fa471774d9975a65febae10d8405637f89d2ba85", default-features = false, features = ["resolvo"] }
rattler_virtual_packages = { git = "https://github.com/conda/rattler", rev = "fa471774d9975a65febae10d8405637f89d2ba85", default-features = false }

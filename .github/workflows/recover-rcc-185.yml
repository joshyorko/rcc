name: Retired RCC v18.19.5 Recovery Hold

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse historical publication
        run: |
          echo "The v18.19.5 recovery publication path is retired. No tag, release, or Homebrew dispatch will be performed."
          echo "Use the reviewed two-phase release process for a future release."
          exit 1

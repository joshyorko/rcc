name: Recover RCC v18.19.5 publication

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/recovery/*recover_rcc_185.py'
      - '.github/workflows/recover-rcc-185.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: recover-rcc-v18.19.5-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s .github/workflows/recovery -p test_recover_rcc_185.py
  recover:
    needs: focused
    if: github.event_name == 'workflow_dispatch' && github.repository == 'joshyorko/rcc' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RECOVERY_ROOT: ${{ github.workspace }}/../rcc-v18.19.5-recovery
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.10'
      - name: Install rollback harness dependency
        run: python -m pip install invoke==2.2.0
      - name: Verify Homebrew handoff prerequisite
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TOOLS_PAT }}
        run: |
          test -n "$GH_TOKEN"
          gh api repos/joshyorko/homebrew-tools/actions/workflows/tap-auto-update.yml --jq '.state' | grep -qx active
      - name: Verify frozen source and download original artifacts
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor d1aec7d0bb897a81274423c7a6bb747233f9c263 HEAD
          python .github/workflows/recovery/recover_rcc_185.py prepare "$RECOVERY_ROOT"
      - name: Corrected N-1 rollback only (existing binaries)
        run: python .github/workflows/recovery/recover_rcc_185.py rollback "$RECOVERY_ROOT"
      - name: Publish verified original RCC assets
        run: python .github/workflows/recovery/recover_rcc_185.py publish "$RECOVERY_ROOT"
      - name: Dispatch normal Homebrew update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TOOLS_PAT }}
        run: |
          gh workflow run tap-auto-update.yml --repo joshyorko/homebrew-tools --ref main -f slot_id=rcc-daily
          echo 'Homebrew rcc-daily dispatch accepted.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve recovery receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rcc-v18.19.5-recovery-receipts
          path: |
            ${{ env.RECOVERY_ROOT }}/*.json
            ${{ env.RECOVERY_ROOT }}/*.log
            ${{ env.RECOVERY_ROOT }}/rollback/*.json

name: Rcc
on:
  push:
    branches:
      - main

    tags:
      - "v*" # Run when a new version tag (e.g., v18.5.0) is pushed
    paths-ignore:
      - ".github/workflows/**"
      - ".dagger/**"

  pull_request:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/**"
      - ".dagger/**"

permissions:
  contents: read

jobs:
  build:
    name: Build RCC
    runs-on: ubuntu-latest
    # Build the exact commit bytes consumed by native runtime jobs and releases.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    env:
      RCC_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # Checkout first so setup-go can locate go.mod/go.sum for caching
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$RCC_CANDIDATE_SHA" ]]; then
            echo "Build checkout differs: $actual_sha != $RCC_CANDIDATE_SHA"
            exit 1
          fi
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26.5"
      - name: Set up Python 3.10
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.10"
      - name: Install invoke
        run: python -m pip install invoke==2.2.0
      - name: Show commit info
        run: inv what
      - name: Debug Build Job
        run: |
          echo "GitHub ref: ${{ github.ref }}"
          echo "GitHub event name: ${{ github.event_name }}"
          echo "Job status: ${{ job.status }}"
      - name: Build RCC
        run: inv build
      - name: Prepare Artifacts
        run: |
          mkdir -p rcc-builds
          cp build/linux64/rcc rcc-builds/rcc-linux64
          cp build/linux64/rccremote rcc-builds/rccremote-linux64
          cp build/windows64/rcc.exe rcc-builds/rcc-windows64.exe
          cp build/windows64/rccremote.exe rcc-builds/rccremote-windows64.exe
          cp build/macos64/rcc rcc-builds/rcc-macos64
          cp build/macos64/rccremote rcc-builds/rccremote-macos64
          cp build/macosarm64/rcc rcc-builds/rcc-macosarm64
          cp build/macosarm64/rccremote rcc-builds/rccremote-macosarm64
      - name: Upload RCC Binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RCC-Binaries
          path: rcc-builds/
      - name: Prepare native runtime binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-runtime-binaries
          cp rcc-builds/rcc-linux64 native-runtime-binaries/
          cp rcc-builds/rcc-macos64 native-runtime-binaries/
          cp rcc-builds/rcc-macosarm64 native-runtime-binaries/
          cp rcc-builds/rcc-windows64.exe native-runtime-binaries/
          (cd native-runtime-binaries && sha256sum * > SHA256SUMS)
      - name: Upload native runtime binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-runtime-binaries
          path: native-runtime-binaries/

  release-candidate:
    name: Release Candidate Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      RCC_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ROBOCORP_HOME: ${{ github.workspace }}/../rcc-release-candidate-home
      RCC_SELF_HOST_EXPECTED_VERSION: v18.18.1
      RCC_N1_BINARY: ${{ github.workspace }}/tmp/released-rcc/rcc
      RCC_N1_ARCHIVE: ${{ github.workspace }}/tmp/rcc-n1-environment.rcca
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$RCC_CANDIDATE_SHA" ]]; then
            echo "Release-candidate checkout differs: $actual_sha != $RCC_CANDIDATE_SHA"
            exit 1
          fi
      - name: Install pinned released RCC
        run: |
          set -euo pipefail
          rcc_dir="${GITHUB_WORKSPACE}/tmp/released-rcc"
          rcc_path="${rcc_dir}/rcc"
          mkdir -p "$rcc_dir"
          curl --fail --show-error --location --retry 3 \
            https://github.com/joshyorko/rcc/releases/download/v18.18.1/rcc-linux64 \
            --output "$rcc_path"
          echo "ab6e25fe616878d79ed2d92ee9c5073d360d8cde637dcf02f2c9bb4b4ef0bfcf  ${rcc_path}" | sha256sum --check -
          chmod +x "$rcc_path"
          echo "$rcc_dir" >> "$GITHUB_PATH"
      - name: Install Linux sandbox dependency
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes bubblewrap
          fi
          bwrap --version
      - name: Run contained release candidate gate
        run: rcc run -r developer/toolkit.yaml --dev -t releaseCandidate
      - name: Upload release candidate evidence
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate-evidence
          path: |
            tmp/self-host-v1.json
            tmp/release-candidate-v1.json
            tmp/native-runtime-receipt.json
            tmp/coordination-blackbox-v1.json
            tmp/large-stream-receipt.json
            tmp/environment-artifacts-robot/
            tmp/output/

  robot:
    name: Native Runtime (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: build
    # Only run tests on push to main or PRs, not on release workflows
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "ubuntu-latest"
            platform: linux-amd64
            asset: rcc-linux64
            binary: build/rcc
            goos: linux
            goarch: amd64
          - os: "macos-15-intel"
            platform: macos-amd64
            asset: rcc-macos64
            binary: build/rcc
            goos: darwin
            goarch: amd64
          - os: "macos-latest"
            platform: macos-arm64
            asset: rcc-macosarm64
            binary: build/rcc
            goos: darwin
            goarch: arm64
          - os: "windows-latest"
            platform: windows-amd64
            asset: rcc-windows64.exe
            binary: build/rcc.exe
            goos: windows
            goarch: amd64
    env:
      RCC_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RCC_NATIVE_PLATFORM: ${{ matrix.platform }}
      RCC_NATIVE_ASSET: ${{ matrix.asset }}
      RCC_NATIVE_BINARY: ${{ matrix.binary }}
      RCC_NATIVE_GOOS: ${{ matrix.goos }}
      RCC_NATIVE_GOARCH: ${{ matrix.goarch }}
      RCC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # Checkout first so setup-go can locate go.mod/go.sum for caching
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$RCC_CANDIDATE_SHA" ]]; then
            echo "Native checkout differs: $actual_sha != $RCC_CANDIDATE_SHA"
            exit 1
          fi
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26.5"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.10"
      - name: Download exact release-built RCC binary
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: native-runtime-binaries
          path: native-runtime-binaries
      - name: Stage and assert native RCC binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build tmp/output
          python - <<'PY'
          import hashlib, os
          from pathlib import Path

          source = Path("native-runtime-binaries") / os.environ["RCC_NATIVE_ASSET"]
          target = Path(os.environ["RCC_NATIVE_BINARY"])
          expected = next(
              line.split()[0]
              for line in (Path("native-runtime-binaries") / "SHA256SUMS").read_text().splitlines()
              if line.split(maxsplit=1)[1] == os.environ["RCC_NATIVE_ASSET"]
          )
          actual = hashlib.sha256(source.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"native RCC bytes differ: {actual} != {expected}")
          import platform, subprocess
          goos = {"Linux": "linux", "Darwin": "darwin", "Windows": "windows"}[platform.system()]
          goarch = {"x86_64": "amd64", "AMD64": "amd64", "aarch64": "arm64", "arm64": "arm64"}[platform.machine()]
          if (goos, goarch) != (os.environ["RCC_NATIVE_GOOS"], os.environ["RCC_NATIVE_GOARCH"]):
              raise SystemExit(f"runner platform differs: {goos}/{goarch}")
          if subprocess.check_output(["go", "env", "GOOS"], text=True).strip() != goos:
              raise SystemExit("go env GOOS does not match runner")
          if subprocess.check_output(["go", "env", "GOARCH"], text=True).strip() != goarch:
              raise SystemExit("go env GOARCH does not match runner")
          target.write_bytes(source.read_bytes())
          if os.name != "nt":
              target.chmod(0o755)
          version = __import__("subprocess").check_output([str(target), "version"], text=True).strip()
          expected_version = next(
              line.split("`")[1]
              for line in Path("common/version.go").read_text().splitlines()
              if "Version = `" in line
          )
          if version != expected_version:
              raise SystemExit(f"native RCC version differs: {version} != {expected_version}")
          print(f"verified {target} {expected} {version}")
          PY
          echo "RCC_REAL_BINARY=$(python -c 'from pathlib import Path; import os; print(Path(os.environ["RCC_NATIVE_BINARY"]).resolve())')" >> "$GITHUB_ENV"
          echo "RCC_REAL_BINARY_SHA256=$(python -c 'import hashlib,os; print(hashlib.sha256(open(os.environ["RCC_NATIVE_BINARY"],"rb").read()).hexdigest())')" >> "$GITHUB_ENV"
          echo "RCC_REAL_RECEIPT_FILE=$(python -c 'from pathlib import Path; print(Path("tmp/output/native-runtime-receipt.json").resolve())')" >> "$GITHUB_ENV"
      - name: Install invoke
        run: python -m pip install invoke==2.2.0
      - name: Setup Robot Environment
        run: |
          inv assets
          inv robotsetup
      - name: Show commit info
        run: inv what
      - name: Run Windows process supervision and artifact lock acceptance
        if: matrix.goos == 'windows'
        shell: bash
        run: go test -count=1 ./environmentlifecycle -run '^(TestExecuteCancellationDoesNotWaitForGrandchildInheritedStreams|TestIndependentProcessArtifactLockContentionBlocks)$' -v
      - name: Run Windows Robot binary spelling acceptance
        if: matrix.goos == 'windows'
        timeout-minutes: 2
        run: python -m robot -d tmp/native-binary-probe robot_tests/environment_artifact_binary.robot
      - name: Run macOS system-alias no-follow acceptance
        if: matrix.goos == 'darwin'
        shell: bash
        run: go test -count=1 ./artifactprovider ./environmentlifecycle ./settings -run '^(TestDarwinSystemAliasPathsPreserveNoFollow|TestDarwinRPathArtifactRelocatesAndExecutesColdAndWarm)$' -v
      - name: Run Windows Environment Artifact Robot acceptance against exact binary
        if: matrix.goos == 'windows'
        timeout-minutes: 8
        run: python -m robot -L DEBUG -d tmp/output robot_tests/environment_artifacts.robot
      - name: Run real native A-to-B acceptance
        shell: bash
        run: |
          set -euo pipefail
          RCC_REAL_ARTIFACT_TEST=1 go test -timeout 30m -count=1 ./environmentlifecycle -run '^TestRealCurrentRCCAtoBVertical$' -v
      - name: Run Environment Artifact Robot acceptance against exact binary
        if: matrix.goos != 'windows'
        timeout-minutes: 8
        run: python -m robot -L DEBUG -d tmp/output robot_tests/environment_artifacts.robot
      - name: Bind Robot evidence into native runtime receipt
        if: success() || failure()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from tasks import _validate_receipt_commit

          receipt = Path(os.environ["RCC_REAL_RECEIPT_FILE"])
          robot = Path("tmp/output/native-runtime-robot-evidence.json")
          if not receipt.is_file() or not robot.is_file():
              raise SystemExit("missing exact CLI receipt or Robot evidence")

          def require(value, key, label):
              if not isinstance(value, dict) or key not in value:
                  raise SystemExit(f"malformed {label}: missing {key}")
              return value[key]

          def lifecycle(label, evidence):
              digest = require(evidence, "artifactDigest", label)
              cold = require(evidence, "cold", label)
              warm = require(evidence, "warm", label)
              mismatch = require(evidence, "mismatch", label)
              if require(cold, "artifactDigest", f"{label}.cold") != digest or require(warm, "artifactDigest", f"{label}.warm") != digest:
                  raise SystemExit(f"{label} digest identity mismatch")
              if require(cold, "cacheHit", f"{label}.cold") != "provider" or require(warm, "cacheHit", f"{label}.warm") != "local-materialization":
                  raise SystemExit(f"{label} cold/warm cache provenance mismatch")
              if require(cold, "materializationId", f"{label}.cold") != require(warm, "materializationId", f"{label}.warm") or require(cold, "path", f"{label}.cold") != require(warm, "path", f"{label}.warm"):
                  raise SystemExit(f"{label} materialization identity mismatch")
              if require(cold, "leaseId", f"{label}.cold") == "" or require(cold, "leaseReleased", f"{label}.cold") is not True:
                  raise SystemExit(f"{label} lease evidence is incomplete")
              compatibility = require(cold, "compatibility", f"{label}.cold")
              worker = require(compatibility, "worker", f"{label}.cold.compatibility")
              worker_os = require(worker, "os", f"{label}.cold.compatibility.worker")
              worker_cpu = require(worker, "cpu", f"{label}.cold.compatibility.worker")
              worker_python = require(worker, "python", f"{label}.cold.compatibility.worker")
              worker_filesystem = require(worker, "filesystem", f"{label}.cold.compatibility.worker")
              if not require(worker, "relocationVersions", f"{label}.cold.compatibility.worker") or not require(worker_os, "family", f"{label}.cold.compatibility.worker.os") or not require(worker_os, "nativeArchitecture", f"{label}.cold.compatibility.worker.os") or not require(worker_cpu, "architecture", f"{label}.cold.compatibility.worker.cpu") or require(worker_filesystem, "maxPath", f"{label}.cold.compatibility.worker.filesystem") <= 0 or require(worker_python, "artifactProvided", f"{label}.cold.compatibility.worker.python") is not True:
                  raise SystemExit(f"{label} worker capability receipt is incomplete")
              if require(warm, "providerDeadWarmReuse", f"{label}.warm") is not True:
                  raise SystemExit(f"{label} provider-dead warm evidence is incomplete")
              if require(mismatch, "rejected", f"{label}.mismatch") is not True or require(mismatch, "providerObjectGets", f"{label}.mismatch") != 0:
                  raise SystemExit(f"{label} mismatch was not rejected before object fetch")
              if require(cold, "nativeImport", f"{label}.cold") != "sqlite3" or not require(cold, "nativeExtension", f"{label}.cold") or not require(cold, "sqliteVersion", f"{label}.cold"):
                  raise SystemExit(f"{label} native import evidence is incomplete")

          def robot_lifecycle(evidence):
              digest = require(evidence, "artifactDigest", "robotExactBinary")
              cold = require(evidence, "cold", "robotExactBinary")
              execute = require(evidence, "execute", "robotExactBinary")
              warm = require(evidence, "warm", "robotExactBinary")
              if any(require(item, "artifactDigest", "robotExactBinary") != digest for item in (cold, execute, warm)):
                  raise SystemExit("Robot artifact identity mismatch")
              if require(cold, "cacheHit", "robotExactBinary.cold") != "provider" or require(execute, "cacheHit", "robotExactBinary.execute") != "local-materialization" or require(warm, "cacheHit", "robotExactBinary.warm") != "local-materialization":
                  raise SystemExit("Robot cache provenance mismatch")
              if len({require(item, "materializationId", "robotExactBinary") for item in (cold, execute, warm)}) != 1 or len({require(item, "path", "robotExactBinary") for item in (cold, execute, warm)}) != 1:
                  raise SystemExit("Robot materialization identity mismatch")
              if require(execute, "leaseId", "robotExactBinary.execute") == "" or require(execute, "leaseReleased", "robotExactBinary.execute") is not True or require(execute, "exitCode", "robotExactBinary.execute") != 0:
                  raise SystemExit("Robot lease/execute evidence is incomplete")
              if require(warm, "providerDeadWarmReuse", "robotExactBinary.warm") is not True:
                  raise SystemExit("Robot provider-dead warm evidence is incomplete")
              native = require(evidence, "native", "robotExactBinary")
              if require(native, "import", "robotExactBinary.native") != "sqlite3" or not require(native, "extension", "robotExactBinary.native") or not require(native, "sqliteVersion", "robotExactBinary.native"):
                  raise SystemExit("Robot native import evidence is incomplete")

          try:
              data = json.loads(receipt.read_text())
              _validate_receipt_commit(data, os.environ["RCC_CANDIDATE_SHA"])
              robot_evidence = json.loads(robot.read_text())
              binary = require(data, "binary", "receipt")
              exact = require(data, "exactBinaryCLI", "receipt")
              source = require(data, "sourceAPI", "receipt")
              if require(data, "artifactDigest", "receipt") != require(exact, "artifactDigest", "exactBinaryCLI"):
                  raise SystemExit("receipt and exact CLI artifact identities differ")
              platform_checks = require(exact, "platformChecks", "exactBinaryCLI")
              platform = require(data, "platform", "receipt")
              expected_checks = {
                  "linux": {"runnerOS", "machine", "caseCollision", "executableSymlink", "filesystemType", "libc", "glibcMuslMismatch"},
                  "darwin": {"runnerOS", "machine", "caseCollision", "executableSymlink", "rosetta", "machoRPath", "machoDependencies", "quarantineXattr", "codeSigning", "translationAllowed", "nativeOnlyOnRosetta"},
                  "windows": {"runnerOS", "machine", "caseCollision", "executableSymlink", "longPath", "junction", "fileLock", "pathNormalization"},
              }
              platform_family = platform.split("_", 1)[0]
              if not isinstance(platform_checks, dict) or set(platform_checks) != expected_checks.get(platform_family, set()):
                  raise SystemExit(f"exact CLI platform probe key set is invalid for {platform}: {sorted(platform_checks)}")
              for key, value in platform_checks.items():
                  if not isinstance(value, str) or not value or value.startswith(("skipped:", "unavailable:", "failed")):
                      if not (platform_family == "darwin" and key == "nativeOnlyOnRosetta" and value == "skipped:native-runner"):
                          raise SystemExit(f"exact CLI platform probe {key} is not a passing or explicit fact: {value}")
              if platform_checks["caseCollision"] not in {"case-insensitive-filesystem", "case-sensitive-filesystem"}:
                  raise SystemExit(f"caseCollision is not a truthful filesystem fact: {platform_checks['caseCollision']}")
              if not isinstance(platform_checks, dict) or not platform_checks:
                  raise SystemExit("exact CLI platform probe receipt is incomplete")
              lifecycle("exactBinaryCLI", exact)
              lifecycle("sourceAPI", source)
              if require(robot_evidence, "binarySha256", "robotExactBinary") != require(binary, "sha256", "receipt"):
                  raise SystemExit("Robot evidence binary does not match staged RCC binary")
              robot_lifecycle(robot_evidence)
              data["robotExactBinary"] = robot_evidence
              receipt.write_text(json.dumps(data, indent=2) + "\n")
          except (json.JSONDecodeError, OSError, TypeError, ValueError) as error:
              raise SystemExit(f"malformed exact CLI receipt or Robot evidence: {error}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() || failure()
        with:
          name: ${{ matrix.platform }}-native-runtime-receipt
          path: ./tmp/output/

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - release-candidate
      - robot
    # Only run this job on tag pushes (e.g., refs/tags/v18.5.0)
    # Publication waits for the tag's native Robot matrix as well as the contained candidate gate.
    # Grant only the permissions needed to publish a release
    permissions:
      contents: write
    env:
      RCC_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Debug Release Job
        run: |
          echo "GitHub ref: ${{ github.ref }}"
          echo "GitHub event name: ${{ github.event_name }}"
          echo "Build job status: ${{ needs.build.result }}"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$RCC_CANDIDATE_SHA" ]]; then
            echo "Release checkout differs: $actual_sha != $RCC_CANDIDATE_SHA"
            exit 1
          fi
      - name: Download Built RCC Binaries
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: RCC-Binaries
          path: rcc-builds/
      - name: Set up Python 3.10
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.10"
      - name: Generate index.json
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          DATE=$(date +"%d.%-m.%Y")
          export DATE

          # Try to fetch existing index.json from latest release
          curl -sL "https://github.com/${REPO}/releases/latest/download/index.json" -o existing.json 2>/dev/null || echo '{"tested":[],"edge":[]}' > existing.json

          # Generate new index.json with this version prepended
          python3 << 'PYEOF'
          import json
          import os

          version = os.environ["VERSION"]
          date = os.environ.get("DATE", "")
          repo = os.environ["REPO"]

          # Load existing or create new
          try:
              with open('existing.json') as f:
                  data = json.load(f)
          except:
              data = {"tested": [], "edge": []}

          # Build download URLs for GitHub releases
          base_url = f"https://github.com/{repo}/releases/download/{version}"
          # Generate changelog anchor (v18.12.0 -> v18120)
          changelog_anchor = version.replace(".", "")

          new_entry = {
              "version": version,
              "when": date,
              "changelog": f"https://github.com/{repo}/blob/main/docs/changelog.md#{changelog_anchor}",
              "windows": f"{base_url}/rcc-windows64.exe",
              "linux": f"{base_url}/rcc-linux64",
              "macos": f"{base_url}/rcc-macos64",
              "macosarm64": f"{base_url}/rcc-macosarm64"
          }

          # Remove duplicate if exists
          data["tested"] = [v for v in data.get("tested", []) if v["version"] != version]

          # Prepend new version
          data["tested"] = [new_entry] + data["tested"]

          # Keep last 20 versions
          data["tested"] = data["tested"][:20]

          with open('rcc-builds/index.json', 'w') as f:
              json.dump(data, f, indent=1)

          print(f"Generated index.json with {len(data['tested'])} versions")
          PYEOF

          cat rcc-builds/index.json
      - name: Validate release topology
        run: python3 scripts/validate_release_topology.py --asset-root rcc-builds --workflow .github/workflows/rcc.yaml --index rcc-builds/index.json
      - name: Validate release tag
        id: validate_tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+)*([-.][0-9A-Za-z]+)*$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          tag_sha="$(git rev-parse "${TAG}^{commit}")"
          if [[ "$tag_sha" != "$RCC_CANDIDATE_SHA" ]]; then
            echo "Release tag target differs: $tag_sha != $RCC_CANDIDATE_SHA"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Validate Homebrew Update Token
        env:
          HOMEBREW_TOOLS_PAT: ${{ secrets.HOMEBREW_TOOLS_PAT }}
        run: |
          if [[ -z "$HOMEBREW_TOOLS_PAT" ]]; then
            echo "HOMEBREW_TOOLS_PAT is required to dispatch the Homebrew tap update."
            exit 1
          fi
      - name: Create Draft Release with Assets
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8
        with:
          files: rcc-builds/*
          tag_name: ${{ steps.validate_tag.outputs.tag }}
          target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.validate_tag.outputs.tag }}
        run: |
          echo "Publishing draft release $TAG..."
          gh release edit "$TAG" --draft=false
          echo "Release $TAG is now public"

      - name: Trigger Homebrew Cask Update
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ secrets.HOMEBREW_TOOLS_PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: 'homebrew-tools',
              workflow_id: 'tap-auto-update.yml',
              ref: 'main',
              inputs: {
                slot_id: 'rcc-daily'
              }
            });

name: Quality report

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Linux build-boundary dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          command -v bwrap
          bwrap --version
      - name: Install asset tool
        run: python -m pip install invoke==2.2.0
      - name: Generate embedded assets
        run: inv assets
      - name: Run mandatory Linux confinement tests
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          go_bin="$(command -v go)"
          sudo env \
            PATH="$PATH" \
            HOME="$RUNNER_TEMP/rcc-root-home" \
            GOPATH="$RUNNER_TEMP/rcc-root-gopath" \
            GOCACHE="$RUNNER_TEMP/rcc-root-gocache" \
            "$go_bin" test ./buildcoord \
              -run '^(TestCommandExecutorEnforcesRuntimePolicyAndProvesStagingUse|TestCommandExecutorRestrictsHostPathsAndKeepsStagingWritable|TestCommandExecutorHonorsTimeout)$' \
              -count=1
      - name: Run quality checks
        shell: bash
        run: |
          set -o pipefail
          {
            echo "## RCC quality report"
            echo
            echo '```text'
            test_status=0
            go test ./... \
              -skip '^(TestCommandExecutorEnforcesRuntimePolicyAndProvesStagingUse|TestCommandExecutorRestrictsHostPathsAndKeepsStagingWritable|TestCommandExecutorHonorsTimeout)$' \
              -count=1 || test_status=$?
            echo '```'
            exit "$test_status"
          } | tee quality-report.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: quality-report.txt

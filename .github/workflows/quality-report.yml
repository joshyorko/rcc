name: Quality report

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install asset tool
        run: python -m pip install invoke==2.2.0
      - name: Generate embedded assets
        run: inv assets
      - name: Run quality checks
        run: |
          {
            echo "## RCC quality report"
            echo
            echo '```text'
            go test ./... -count=1
            echo '```'
          } | tee quality-report.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: quality-report.txt

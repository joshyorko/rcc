name: Copilot Setup Steps

on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

env:
    ROBOCORP_HOME: ${{ github.workspace }}/.rcc_home

jobs:
    copilot-setup-steps:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Install RCC
              run: |
                  rcc_version="v18.17.7"
                  rcc_sha256="b49c5bdf98f55694ca366d715a260a0c54943b835a6dd8571fdf5c3260df17cf"
                  rcc_dir=".tools/rcc/${rcc_version}"
                  rcc_path="${rcc_dir}/rcc"
                  if [ ! -f "$rcc_path" ]; then
                    mkdir -p "$rcc_dir"
                    curl --fail --show-error --location \
                      "https://github.com/joshyorko/rcc/releases/download/${rcc_version}/rcc-linux64" \
                      --output "$rcc_path"
                  fi
                  echo "${rcc_sha256}  ${rcc_path}" | sha256sum --check -
                  chmod +x "$rcc_path"
                  echo "${GITHUB_WORKSPACE}/${rcc_dir}" >> "$GITHUB_PATH"
                  export PATH="${GITHUB_WORKSPACE}/${rcc_dir}:$PATH"
                  rcc version

            - name: Cache ROBOCORP_HOME
              uses: actions/cache@v5.0.1
              with:
                  path: ${{ env.ROBOCORP_HOME }}
                  key: rcc-home-${{ runner.os }}-${{ hashFiles('developer/setup.yaml', 'developer/toolkit.yaml') }}
                  restore-keys: |
                      rcc-home-${{ runner.os }}-

            - name: Disable RCC telemetry
              run: rcc config identity -t

            - name: Show environment info
              run: rcc ht vars developer/setup.yaml 

name: Release readiness contracts

on:
  pull_request:
    paths:
      - scripts/release_readiness.py
      - scripts/test_release_readiness.py
      - scripts/release_publication.py
      - .github/workflows/export-release-evidence.yml
      - .github/workflows/release-readiness-tests.yml
  push:
    branches: [main]
    paths:
      - scripts/release_readiness.py
      - scripts/test_release_readiness.py
      - scripts/release_publication.py
      - .github/workflows/export-release-evidence.yml
      - .github/workflows/release-readiness-tests.yml

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.10"
      - run: python -m unittest scripts.test_release_readiness scripts.test_release_publication

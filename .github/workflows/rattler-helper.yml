name: Native Rattler helper
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: helper
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26.9"
      - run: python -m pip install invoke==2.2.0
      - run: python -m invoke assets
        working-directory: .
      - run: rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - run: cargo build --locked --release
      - run: |
          bin=target/release/rcc-rattler-helper
          if [[ "$RUNNER_OS" == Windows ]]; then bin+=.exe; fi
          digest=$(python -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "$bin")
          rcc=target/release/rcc
          if [[ "$RUNNER_OS" == Windows ]]; then rcc+=.exe; fi
          go build -ldflags "-X github.com/joshyorko/rcc/conda.rattlerHelperSHA256=$digest" -o "$rcc" ../cmd/rcc
          python tests/native_install.py "$bin" "$rcc"

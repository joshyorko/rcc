name: Native Rattler helper
on:
  workflow_call:
    inputs:
      candidate:
        required: true
        type: string
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: helper
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.candidate }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26.9"
      - run: python -m pip install invoke==2.2.0
      - run: python -m invoke assets
        working-directory: .
      - run: rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - run: cargo build --locked --release
      - run: |
          bin=target/release/rcc-rattler-helper
          if [[ "$RUNNER_OS" == Windows ]]; then bin+=.exe; fi
          cd ..
          python scripts/prepare_provider_defaults.py --helper "helper/$bin"
          rcc=helper/target/release/rcc
          if [[ "$RUNNER_OS" == Windows ]]; then rcc+=.exe; fi
          go build -tags rcc_provider_defaults -ldflags "-s -w" -o "$rcc" ./cmd/rcc
          python helper/tests/native_install.py "helper/$bin" "$rcc"
          if [[ "$RUNNER_OS" == Linux ]]; then python helper/tests/remote_channel.py "helper/$bin"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-defaults-${{ matrix.os }}-${{ inputs.candidate }}
          path: |
            blobs/provider_payload_*.go
            blobs/assets/provider_default.*.gz
          if-no-files-found: error
          retention-days: 3

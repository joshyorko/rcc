name: Coverage gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Linux build-boundary dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          command -v bwrap
          bwrap --version
      - name: Install asset tool
        run: python -m pip install invoke==2.2.0
      - name: Generate embedded assets
        run: inv assets
      - name: Run mandatory Linux confinement tests
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          go_bin="$(command -v go)"
          sudo env \
            PATH="$PATH" \
            HOME="$RUNNER_TEMP/rcc-root-home" \
            GOPATH="$RUNNER_TEMP/rcc-root-gopath" \
            GOCACHE="$RUNNER_TEMP/rcc-root-gocache" \
            "$go_bin" test ./buildcoord \
              -run '^(TestCommandExecutorEnforcesRuntimePolicyAndProvesStagingUse|TestCommandExecutorRestrictsHostPathsAndKeepsStagingWritable|TestCommandExecutorHonorsTimeout)$' \
              -count=1
      - name: Run tests with coverage
        run: |
          go test ./... \
            -skip '^(TestCommandExecutorEnforcesRuntimePolicyAndProvesStagingUse|TestCommandExecutorRestrictsHostPathsAndKeepsStagingWritable|TestCommandExecutorHonorsTimeout)$' \
            -coverprofile=coverage.out \
            -covermode=atomic
      - name: Enforce configured line coverage
        env:
          COVERAGE_FILE: coverage.out
        run: |
          threshold=$(node -e 'process.stdout.write(String(require("./.coverage-thresholds.json").line))')
          actual=$(go tool cover -func="$COVERAGE_FILE" | awk '/^total:/{gsub("%", "", $3); print $3}')
          node -e 'const actual=Number(process.argv[1]); const threshold=Number(process.argv[2]); if (!(actual >= threshold)) { console.error(`coverage ${actual}% is below ${threshold}%`); process.exit(1) } console.log(`coverage ${actual}% meets ${threshold}%`) ' "$actual" "$threshold"

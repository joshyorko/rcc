name: PatchRaptor RCC Release

# RCC_LEGACY_RELEASE_RETIRED: no main writes or tag workflow dispatch.
# Atomic with the PR-only metadata controller; never restore as token fallback.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Hold retired version controller
        run: |
          echo 'Direct version bumps and legacy tag dispatch are retired. Use the release-metadata PR workflow; protected publication is unchanged.'
          exit 1
